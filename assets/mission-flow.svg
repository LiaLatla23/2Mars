      <text x="122" y="43" fill="#fff" font-size="22" font-weight="700">PLAN</text><text x="110" y="73" fill="#c7d1dc" font-size="13">Objectives & constraints</text>
    </g>
    <path d="M305 225h32m-9-8 9 8-9 8" stroke="#e9a07e" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(350 175)">
      <rect width="220" height="100" rx="16" fill="#26384b" stroke="#5d7186"/>
      <circle cx="34" cy="34" r="17" fill="#d77c58"/><text x="34" y="40" fill="#fff" font-size="17" font-weight="700">2</text>
      <text x="122" y="43" fill="#fff" font-size="22" font-weight="700">DESIGN</text><text x="110" y="73" fill="#c7d1dc" font-size="13">Build your rover</text>
    </g>
    <path d="M575 225h32m-9-8 9 8-9 8" stroke="#e9a07e" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(620 175)">
      <rect width="220" height="100" rx="16" fill="#26384b" stroke="#5d7186"/>
      <circle cx="34" cy="34" r="17" fill="#d77c58"/><text x="34" y="40" fill="#fff" font-size="17" font-weight="700">3</text>
      <text x="122" y="43" fill="#fff" font-size="22" font-weight="700">LAUNCH</text><text x="110" y="73" fill="#c7d1dc" font-size="13">Travel to Mars</text>
    </g>
    <path d="M845 225h32m-9-8 9 8-9 8" stroke="#e9a07e" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(890 175)">
      <rect width="220" height="100" rx="16" fill="#26384b" stroke="#5d7186"/>
      <circle cx="34" cy="34" r="17" fill="#d77c58"/><text x="34" y="40" fill="#fff" font-size="17" font-weight="700">4</text>
      <text x="122" y="43" fill="#fff" font-size="22" font-weight="700">EXPLORE</text><text x="110" y="73" fill="#c7d1dc" font-size="13">Investigate & collect</text>
