<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="330" viewBox="0 0 1440 330" role="img" aria-labelledby="title desc">
  <title id="title">The 2Mars mission flow</title>
  <desc id="desc">Five connected stages: Plan, Design, Launch, Explore and Learn.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#202b3c"/>
    </linearGradient>
    <linearGradient id="mars" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0a17a"/>
      <stop offset="1" stop-color="#a84231"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="330" rx="24" fill="url(#bg)"/>
  <circle cx="1290" cy="70" r="125" fill="#b94f3b" opacity=".14"/>
  <circle cx="1290" cy="70" r="74" fill="url(#mars)"/>
  <path d="M1227 61c26-24 43-17 62-35 18 18 39 20 57 41-25 8-34 27-64 25-20-1-34-13-55-31Z" fill="#7e342d" opacity=".55"/>
  <g fill="#f4f0e9" opacity=".7">
