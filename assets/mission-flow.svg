    <circle cx="1080" cy="234" r="1.8"/><circle cx="1010" cy="72" r="1.6"/><circle cx="1390" cy="130" r="1.5"/>
  </g>
  <text x="70" y="76" fill="#f4f0e9" font-family="Arial, Helvetica, sans-serif" font-size="19" letter-spacing="4">FROM MISSION CONCEPT TO MARTIAN DISCOVERY</text>
  <text x="70" y="126" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">Every decision shapes the mission.</text>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <g transform="translate(80 175)">
